version: "3.8"

x-common: &common
  extra_hosts:
    - "host.docker.internal:host-gateway"
  env_file: .env

services:
  guardian-health:
    <<: *common
    image: curlimages/curl
    command: ["-s", "-f", "-m", "5", "http://host.docker.internal:11434/v1/models"]

  searxng:
    <<: *common
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./configs/searxng:/etc/searxng:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      
  sandbox:
    <<: *common
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
    environment:
      - OPENAI_API_BASE=${GUARDIAN_BASE_URL}
      - OPENAI_API_KEY=${GUARDIAN_API_KEY}
      - AIDER_MODEL=openai/${DEFAULT_MODEL}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - WINDOWS_UNREAL_SSH_ALIAS=${WINDOWS_UNREAL_SSH_ALIAS:-unreal-windows}
      - WINDOWS_UNREAL_SSH_HOST=${WINDOWS_UNREAL_SSH_HOST:-192.168.1.245}
      - WINDOWS_UNREAL_SSH_USER=${WINDOWS_UNREAL_SSH_USER:-onyou}
      # Agent Zero: route the generic "other" OpenAI-compatible provider to Guardian
      - OTHER_API_KEY=${GUARDIAN_API_KEY}
      # Agent Zero internal overrides (Knowledge base skip)
      - A0_SET_agent_knowledge_subdir=disabled
      - WEB_UI_HOST=0.0.0.0
      - WEB_UI_PORT=50001
    ports:
      # Bound to LAN so the Agent Zero UI is reachable from other machines on
      # the local network (e.g. http://192.168.1.35:50001). Guardian's auth
      # still gates LLM access; AZ itself has no auth, so do NOT expose this
      # outside the LAN.
      - "0.0.0.0:50001:50001"
    volumes:
      - ${ACTIVE_PROJECT}:/workspace/project:rw
      - ./cockpit:/workspace/kyberm0nk/cockpit:ro
      - ./configs/aider:/config/aider:ro
      - ./configs/opencode:/config/opencode:ro
      - ./configs/agent-zero:/config/agent-zero:ro
      - ./configs/ssh/windows-unreal.config:/root/.ssh/config:ro
      - ${WINDOWS_UNREAL_SSH_KEY_PATH:-/home/flip/.ssh/kyberm0nk_windows_unreal_ed25519}:/run/kyberm0nk/secrets/windows_unreal_ed25519:ro
      # AZ patches mounted directly into the source
      - ./configs/agent-zero/patches/modules.py:/opt/agent-zero/helpers/modules.py:ro
      - ./configs/agent-zero/patches/code_execution_tool.py:/opt/agent-zero/plugins/_code_execution/tools/code_execution_tool.py:ro
      - ./configs/agent-zero/patches/searxng.py:/opt/agent-zero/helpers/searxng.py:ro
      - ./logs:/logs:rw
    security_opt:
      - no-new-privileges:true
