tools:
  newnexus_github_search:
    type: github_search
    github_repo: m0nklabs/NewNexus
    content_types:
      - code
      - repo
      - pr
      - issue
    token_env: GITHUB_TOKEN
    fallback_token_env: GH_TOKEN

  newnexus_github_push:
    type: github_push
    github_repo: m0nklabs/NewNexus
    token_env: GITHUB_TOKEN
    fallback_token_env: GH_TOKEN

  newnexus_windows_ssh:
    type: windows_ssh_command
