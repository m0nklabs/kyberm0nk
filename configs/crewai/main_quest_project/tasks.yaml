tasks:
  capture_operator_intent:
    agent: main_quest_project_manager
    async_execution: false
    context: []
    description: >
      Read the operator input for {operator_goal}, {project_path}, {current_state},
      {operator_chat_guidance}, {repo_write_mode}, and {github_target_branch}.
      Convert it into a short NewNexus Unreal
      playable-slice brief. If project_path is empty, assume the GitHub repo
      m0nklabs/NewNexus and the local workspace ~/NewNexus. Identify unclear
      requirements, but
      continue with reasonable Unreal-specific assumptions when safe. Treat
      repo_write_mode=disabled as a hard non-destructive constraint.
    expected_output: >
      A compact Unreal/NewNexus playable-slice brief with objective, assumptions,
      non-goals, likely repository files or systems, validation target, write
      policy, target branch, and open steering questions. Explicitly name
      NewNexus and Unreal Engine.

  research_project_state:
    agent: local_game_researcher
    async_execution: false
    context:
      - capture_operator_intent
    description: >
      Using the brief, inspect the requested project path conceptually and produce
      a local-context summary for NewNexus. Focus on Unreal architecture, likely
      implementation files under Source/, Config/, Content/, Build.cs, .uproject
      metadata, tests/build commands, and risks. Never replace this with Unity,
      generic 2D, or another engine unless the operator explicitly asks.
    expected_output: >
      A NewNexus file-and-system context summary, recommended first Unreal
      implementation slice, and a validation checklist using UnrealBuildTool or
      editor smoke tests where appropriate.

  plan_and_delegate:
    agent: main_quest_project_manager
    async_execution: false
    context:
      - capture_operator_intent
      - research_project_state
    description: >
      Create a small execution plan for the NewNexus Unreal slice. Prefer Guardian
      workers for routine work. Respect repo_write_mode and github_target_branch
      when proposing edits. Define clear escalation gates: two failed local
      attempts, risky Unreal architecture changes, or hard engine/build blockers.
    expected_output: >
      A numbered implementation plan with owner role per step, expected artifacts,
      Unreal/NewNexus validation commands, write mode, target branch, and
      cloud-escalation triggers.

  draft_implementation:
    agent: local_game_builder
    async_execution: false
    context:
      - plan_and_delegate
    description: >
      Implement the next smallest NewNexus Unreal step. Do not invent unrelated systems or switch engines.
      If repo_write_mode is enabled, use the newnexus_github_push tool to commit
      and push the code changes, defaulting to github_target_branch unless a
      narrower branch is explicitly justified. If repo_write_mode is disabled,
      do not fabricate a push; instead produce the exact patch plan and
      verification commands needed for a reviewed follow-up.
      Include exact files to edit, expected behavior, Unreal-specific edge cases,
      and fallback if blocked.
    expected_output: >
      If repo_write_mode is enabled: confirmation that the file(s) were
      successfully pushed, behavior added/fixed, Unreal edge cases, and commands
      to verify the slice. If repo_write_mode is disabled: the exact patch plan,
      affected files, expected behavior, Unreal edge cases, verification
      commands, and an explicit note that repository writes were blocked.

  review_and_acceptance:
    agent: qa_playtest_reviewer
    async_execution: false
    context:
      - capture_operator_intent
      - plan_and_delegate
      - draft_implementation
    description: >
      Review the implementation package against the operator goal and steering
      guidance. Flag missing Unreal validation, likely gameplay regressions,
      compile/reflection/config issues, UX issues, ignored write-mode
      constraints, and any case where a stronger model should be used before
      code is accepted.
    expected_output: >
      A pass/fail review with severity-ordered findings, required fixes, and the
      final NewNexus acceptance checklist for the operator.
