crew:
  name: Kyber Main Quest Game Project Manager
  process: hierarchical
  verbose: true
  memory: false
  cache: true
  planning: false
  max_rpm: 30
  manager_llm:
    provider: openrouter
    model: deepseek/deepseek-v4-flash
    temperature: 0.15
  planning_llm:
    provider: openrouter
    model: z-ai/glm-4.7-flash
    temperature: 0.2

providers:
  openrouter:
    sdk_provider: openai
    api_key_env: OPENROUTER_API_KEY
    api_base_env: OPENROUTER_API_BASE
    default_api_base: https://openrouter.ai/api/v1
  guardian:
    sdk_provider: openai
    api_key_env: CREWAI_GUARDIAN_API_KEY
    api_base_env: GUARDIAN_API_BASE
    default_api_base: http://127.0.0.1:11434/v1
